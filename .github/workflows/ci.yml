name: CI - Lint, Test, Build, E2E

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Run E2E tests'
        required: false
        type: boolean
        default: false
      skip_docker:
        description: 'Skip Docker builds'
        required: false
        type: boolean
        default: true
      max_issues:
        description: 'Maximum issues to process (pass-through for downstream tools)'
        required: false
        type: string

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-18-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-18-

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint
        continue-on-error: false

      - name: Run type check
        run: npm run typecheck
        continue-on-error: false

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          CI: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Build client
        run: npm run build:client
        env:
          # Use minimal config for build to avoid requiring real API keys
          VITE_APP_MODE: demo
          VITE_STRICT_REAL_DATA: false
          VITE_USE_MOCK_DATA: true
          VITE_API_BASE: http://localhost:8001
          VITE_WS_BASE: ws://localhost:8001

      - name: Build server
        run: npm run build:server

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: build-artifacts
          path: |
            dist/
          retention-days: 7

      - name: Upload failure logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-logs
          path: |
            *.log
            npm-debug.log*
          retention-days: 3

      - name: Report status
        if: always()
        run: |
          echo "::group::Build Summary"
          echo "Node version: 18"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Status: ${{ job.status }}"
          echo "::endgroup::"

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-test
    # Run E2E only if: manual dispatch with run_e2e=true OR push to main
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_e2e == 'true') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start dev server in background
        run: |
          npm run dev &
          echo "DEV_SERVER_PID=$!" >> $GITHUB_ENV
        env:
          # Use mock data for E2E to avoid requiring real API keys
          VITE_APP_MODE: demo
          VITE_USE_MOCK_DATA: true

      - name: Wait for server to be ready
        run: |
          echo "Waiting for server at http://localhost:5173..."
          npx wait-on http://localhost:5173 --timeout 60000 --interval 2000 || (echo "Server failed to start" && exit 1)

      - name: Run Playwright E2E tests
        run: npx playwright test --reporter=html
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload E2E failure logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure-logs
          path: |
            *.log
            test-results/
          retention-days: 3

      - name: Cleanup dev server
        if: always()
        run: |
          if [ ! -z "$DEV_SERVER_PID" ]; then
            kill $DEV_SERVER_PID || true
          fi
          # Kill any remaining node processes on port 5173
          lsof -ti:5173 | xargs kill -9 || true

      - name: Report E2E status
        if: always()
        run: |
          echo "::group::E2E Summary"
          echo "Status: ${{ job.status }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "::endgroup::"

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-test
    # Skip Docker if workflow_dispatch with skip_docker=true
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.skip_docker != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check for Dockerfiles
        id: check_dockerfiles
        run: |
          if [ -f "Dockerfile.backend" ]; then
            echo "backend_exists=true" >> $GITHUB_OUTPUT
          else
            echo "backend_exists=false" >> $GITHUB_OUTPUT
          fi
          if [ -f "Dockerfile.frontend" ]; then
            echo "frontend_exists=true" >> $GITHUB_OUTPUT
          else
            echo "frontend_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build backend image
        if: steps.check_dockerfiles.outputs.backend_exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
          tags: dreammaker-backend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        if: steps.check_dockerfiles.outputs.frontend_exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: false
          tags: dreammaker-frontend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report Docker build status
        if: always()
        run: |
          echo "::group::Docker Build Summary"
          echo "Backend image: ${{ steps.check_dockerfiles.outputs.backend_exists == 'true' && 'dreammaker-backend:ci-test' || 'skipped' }}"
          echo "Frontend image: ${{ steps.check_dockerfiles.outputs.frontend_exists == 'true' && 'dreammaker-frontend:ci-test' || 'skipped' }}"
          echo "Status: ${{ job.status }}"
          echo "::endgroup::"
